[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-coverage"
version = "0.1.0"
description = "Pre- vs post-snap NFL coverage recognition from tracking data and footage"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs YOLO on real sample film (skip with -m \"not slow\")"]
